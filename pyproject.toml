[project]
name = "youtube-clips"
version = "0.2.0"
description = "Turn captioned YouTube videos into portrait clips, with automatic framing and optional publishing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "clipper/assets/LICENSE-YuNet"]
requires-python = ">=3.12"
dependencies = [
  "yt-dlp[default]>=2025.11.12",
  "pysubs2>=1.8,<2",
  "rich>=14,<15",
  "prompt-toolkit>=3.0.50,<4",
  "opencv-python-headless>=4.13.0.92,<4.14",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["ruff>=0.12", "mypy>=1.15", "build>=1.2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
youtube-clips = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper", "clipper.assets", "clipper.publishing"]
py-modules = ["clips"]

[tool.setuptools.package-data]
clipper = ["assets/*.onnx", "assets/LICENSE-YuNet"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN", "C4", "DTZ", "PIE", "PLW", "RUF", "S"]
allowed-confusables = ["×", "–", "＼", "｛", "｝"]

[tool.ruff.lint.per-file-ignores]
# Commands use argument lists; clipboard text is sent over stdin.
"clipper/clipboard.py" = ["S603"]
"clipper/detection.py" = ["S603"]
"clipper/render.py" = ["S603"]
# The clip-selection prompt is prose, not an SQL query.
"clipper/manual.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["clipper", "clips.py"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "gi.*"]
ignore_missing_imports = true
